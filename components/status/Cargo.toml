[package]
name = "ubihome-status"
version = "0.1.0"
authors = ["Daniel Habenicht <daniel-habenicht@outlook.de>"]
edition = "2021"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ubihome-core = { path = "../core", features = ["validation"] }
garde = { version = "0.22.1", features = ["serde"] }
duration-str = "0.16.1"

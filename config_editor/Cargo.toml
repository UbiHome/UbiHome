[package]
name = "ubihome-config_editor"
version = "0.1.0"
authors = ["Daniel Habenicht <daniel-habenicht@outlook.de>"]
edition = "2021"
description = "Visual configuration editor for UbiHome (egui), usable natively or in the browser."

[lib]
path = "src/lib.rs"

[[bin]]
name = "ubihome-config-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = [
    "serialize",
    "deserialize",
] }
regex = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "wayland",
    "x11",
] }
rfd = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
rfd = { version = "0.18.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
